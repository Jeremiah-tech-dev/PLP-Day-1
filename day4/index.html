<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>QuickNotes</title>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
      </nav>
    </header>

    <main>
      <section aria-labelledby="editor-heading">
        <h2 id="editor-heading">Write a note</h2>
        <label for="note-text">Note text</label>
        <textarea id="note-text" rows="8" placeholder="Start writing..."></textarea>
        <p id="char-count" aria-live="polite">0 / 200 characters</p>
        <p id="word-count" aria-live="polite">0 words</p>
        <button id="clear-btn" type="button">Clear</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
